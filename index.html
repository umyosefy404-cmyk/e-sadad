<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<title>e-SADAD Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f1f5f9;--c:#fff;--tx:#0f172a;--mt:#64748b;--br:#1e40af;--b2:#3b82f6;--ac:#10b981;--bd:#e2e8f0;--sh:0 2px 10px rgba(0,0,0,.06)}
[data-d="1"]{--bg:#0f172a;--c:#1e293b;--tx:#e2e8f0;--mt:#94a3b8;--bd:#334155;--sh:0 2px 10px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:20px;transition:.2s}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;padding:14px;box-shadow:0 2px 12px rgba(30,64,175,.3)}
header h1{font-size:15px;font-weight:700}
header .s{font-size:11px;opacity:.85;margin-top:2px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.thm{width:38px;height:38px;border-radius:10px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:16px;cursor:pointer}
main{padding:12px}
select{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--c);color:var(--tx);font-size:14px;font-weight:600;margin-bottom:12px;outline:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--c);border-radius:14px;padding:12px;box-shadow:var(--sh);position:relative;overflow:hidden;border:1px solid var(--bd)}
.kpi::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--b2)}
.kpi.g::before{background:var(--ac)}.kpi.o::before{background:#f59e0b}.kpi.p::before{background:#8b5cf6}
.kpi .l{font-size:10.5px;color:var(--mt);margin-bottom:5px;font-weight:600}
.kpi .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--b2)}
.kpi .v.gr{color:var(--ac)}.kpi .v.or{color:#f59e0b}.kpi .v.pu{color:#8b5cf6}
.card{background:var(--c);border-radius:14px;padding:14px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:12px}
.card h3{font-size:13px;color:var(--br);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
[data-d="1"] .card h3{color:var(--b2)}
.cw{position:relative;height:380px}
.srch{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:13px;margin-bottom:8px;outline:none}
.ts{overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:65vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:480px}
thead{position:sticky;top:0;z-index:2}
th{padding:9px 8px;text-align:right;font-weight:700;background:#eff6ff;color:var(--br);font-size:11px;border-bottom:1px solid var(--bd)}
[data-d="1"] th{background:#1e3a8a55;color:#93c5fd}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:middle}
td.n{font-weight:700;color:var(--b2);font-variant-numeric:tabular-nums;white-space:nowrap}
td.p{color:var(--ac);font-weight:600;font-size:11.5px;white-space:nowrap}
.bm{display:inline-block;height:5px;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:3px;vertical-align:middle;margin-right:5px;max-width:50px}
</style>
</head>
<body>
<header>
<div class="hdr">
<div>
<h1>📊 لوحة e-SADAD التفاعلية</h1>
<div class="s" id="sub">اختر القناة لعرض التفاصيل</div>
</div>
<button class="thm" id="thm">🌙</button>
</div>
</header>
<main>
<select id="sel"></select>
<div class="kpis">
<div class="kpi"><div class="l">إجمالي العمليات</div><div class="v" id="k1">-</div></div>
<div class="kpi g"><div class="l">عدد المفوترين</div><div class="v gr" id="k2">-</div></div>
<div class="kpi o"><div class="l">عدد الخدمات</div><div class="v or" id="k3">-</div></div>
<div class="kpi p"><div class="l">متوسط/خدمة</div><div class="v pu" id="k4">-</div></div>
</div>
<div class="card">
<h3>🏆 أعلى 15 خدمة</h3>
<div class="cw"><canvas id="bc"></canvas></div>
</div>
<div class="card">
<h3>📋 كل الخدمات</h3>
<input class="srch" id="srch" placeholder="🔍 ابحث...">
<div class="ts">
<table>
<thead><tr><th>المفوتر</th><th>الخدمة</th><th>العمليات</th><th>النسبة</th></tr></thead>
<tbody id="tb"></tbody>
</table>
</div>
</div>
</main>
<script src="data.js"></script>
<script>
const N=x=>Number(x).toLocaleString('en-US');
let myChart=null;
const sel=document.getElementById('sel');
Object.keys(D).forEach(k=>{
  const o=document.createElement('option');
  o.value=k;o.textContent=k+' ('+N(D[k][0])+')';
  sel.appendChild(o);
});
function drawChart(rows){
  const top=rows.slice(0,15);
  const ctx=document.getElementById('bc').getContext('2d');
  if(myChart)myChart.destroy();
  const dk=document.documentElement.dataset.d==='1';
  myChart=new Chart(ctx,{
    type:'bar',
    data:{labels:top.map(r=>r[1].length>30?r[1].slice(0,30)+'…':r[1]),
      datasets:[{data:top.map(r=>r[2]),backgroundColor:'#3b82f6',borderRadius:6}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{rtl:true,textDirection:'rtl',callbacks:{label:c=>N(c.raw)}}},
      scales:{x:{ticks:{color:dk?'#94a3b8':'#64748b',font:{size:10}},grid:{color:dk?'#334155':'#e2e8f0'}},
        y:{ticks:{color:dk?'#e2e8f0':'#0f172a',font:{size:10}},grid:{display:false}}}}
  });
}
function drawTable(rows,total){
  const tb=document.getElementById('tb');
  if(!rows.length){tb.innerHTML='<tr><td colspan="4" style="text-align:center;padding:30px;color:#94a3b8">لا توجد نتائج</td></tr>';return}
  tb.innerHTML=rows.map(r=>{
    const pct=total?(r[2]/total*100):0;
    const w=Math.max(3,Math.min(50,pct*1.5));
    return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="n">'+N(r[2])+'</td><td class="p"><span class="bm" style="width:'+w+'px"></span>'+pct.toFixed(2)+'%</td></tr>';
  }).join('');
}
function load(name){
  const c=D[name];if(!c)return;
  const [t,o,s,str]=c;
  document.getElementById('k1').textContent=N(t);
  document.getElementById('k2').textContent=N(o);
  document.getElementById('k3').textContent=N(s);
  document.getElementById('k4').textContent=s?N(Math.round(t/s)):'0';
  document.getElementById('sub').textContent=name;
  const rows=str.split('~').map(x=>{const p=x.split('|');return [p[0],p[1],parseInt(p[2])||0]}).filter(r=>r[2]>0).sort((a,b)=>b[2]-a[2]);
  drawChart(rows);drawTable(rows,t);
  document.getElementById('srch').value='';
  document.getElementById('srch').oninput=e=>{
    const q=e.target.value.trim();
    drawTable(q?rows.filter(r=>r[0].includes(q)||r[1].includes(q)):rows,t);
  };
}
document.getElementById('thm').onclick=()=>{
  const cur=document.documentElement.dataset.d==='1'?'0':'1';
  document.documentElement.dataset.d=cur;
  document.getElementById('thm').textContent=cur==='1'?'☀️':'🌙';
  load(sel.value);
};
sel.onchange=()=>load(sel.value);
load(Object.keys(D)[0]);
</script>
</body>
</html>
